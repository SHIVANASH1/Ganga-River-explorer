name: 🌊 Ganga Daily Data Update

on:
  schedule:
    # Runs every day at 00:30 UTC = 06:00 AM IST
    - cron: '30 0 * * *'

  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push data.json back

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 🔄 Run data fetch script
        run: python fetch_data.py

      - name: 📤 Commit & push updated data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "🌊 Auto-update: $(date +'%Y-%m-%d %H:%M IST')"
          git push
